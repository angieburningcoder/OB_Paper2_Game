<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HERO 製造機</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap">
<style>
/* Layout: step strip, projector (left) + phone (right), host notes below.
   One deliberate light world: low-saturation Microsoft four-color macarons on frosted glass. */
:root{
  color-scheme:light;
  --bg:#f4f5fa; --ink:#2b3046; --muted:#6c7290; --line:rgba(43,48,70,.12);
  --glass:rgba(255,255,255,.62); --glass-strong:rgba(255,255,255,.82);
  --red:#f1b5a8; --green:#cfe3a6; --blue:#abd8f0; --yellow:#fbe0a0; --lav:#d8d1f2; --mint:#bfe6da;
  --red-ink:#b9594a; --blue-ink:#2f7fae; --accent:#5b8fd6;
  --pixel:"Noto Sans TC",system-ui,sans-serif;
  --round:"Noto Sans TC",system-ui,sans-serif;
}
body{background:var(--bg);color:var(--ink);font-family:var(--round);font-size:15px;min-height:100%;
  background-image:radial-gradient(40% 35% at 8% 10%,rgba(241,181,168,.45),transparent 70%),radial-gradient(35% 35% at 92% 8%,rgba(171,216,240,.5),transparent 70%),radial-gradient(40% 40% at 85% 90%,rgba(207,227,166,.45),transparent 70%),radial-gradient(35% 35% at 10% 92%,rgba(251,224,160,.5),transparent 70%);background-attachment:fixed}
.glass{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.8);box-shadow:0 8px 30px rgba(60,70,110,.08)}
.btn{border:0;background:var(--ink);color:#fff;border-radius:12px;padding:10px 16px;font:700 14px var(--round);cursor:pointer}
.btn.ghost{background:var(--glass-strong);color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.35;cursor:default}
button:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.timer{font:700 1.15em var(--round);color:var(--muted);margin-left:auto;padding:4px 14px;border-radius:999px;font-variant-numeric:tabular-nums}
.timer:empty{padding:0}
.timer.share{background:var(--blue);color:var(--ink)}
.timer.warn{background:var(--yellow);color:var(--ink)}
.timer.over{background:var(--red-ink);color:#fff;animation:flash 1s ease-in-out infinite}
@keyframes flash{50%{opacity:.35}}
.stage{border-radius:18px;min-height:520px;padding:22px 26px;display:flex;flex-direction:column;gap:14px}
.stage h2{margin:0;font:900 clamp(20px,2.4vw,28px)/1.35 var(--round);text-wrap:balance}
.eyebrow{font:400 13px var(--pixel);letter-spacing:.12em;color:var(--muted)}
.big{font:400 clamp(48px,6vw,80px)/1 var(--pixel)}
.row{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.scard{background:var(--glass-strong);border:1px solid var(--line);border-radius:14px;padding:14px 18px;display:flex;flex-direction:column;gap:10px;line-height:1.65}
.scard h3{margin:0;font:900 clamp(18px,2vw,23px) var(--round)}
.groups{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:auto}
@media (max-width:620px){.groups{grid-template-columns:repeat(3,minmax(0,1fr))}}
.g{border:2px dashed var(--line);border-radius:12px;padding:10px;text-align:center;font-size:13px;color:var(--muted)}
.g.ok{border-style:solid;border-color:#9fc77a;background:color-mix(in srgb,var(--green) 55%,#fff);color:var(--ink)}
.g b{display:block;font:400 16px var(--pixel);color:var(--ink)}
.groups.live .g{border-width:3px;animation:breathe 2.2s ease-in-out infinite}
.groups.live .g.ok{animation:none;box-shadow:0 0 0 4px rgba(159,199,122,.35),0 8px 22px rgba(111,154,63,.35)}
.groups.live .g.new{animation:okpop .7s cubic-bezier(.2,1.6,.4,1)}
@keyframes breathe{50%{border-color:var(--accent);background:rgba(91,143,214,.1)}}
@keyframes okpop{0%{transform:scale(.85)}60%{transform:scale(1.08)}}
.revgrid{display:flex;flex-direction:column;gap:14px}
.revgrid .ask{display:none}
.revgrid .scard{font-size:.9em}
.ans.wide{gap:10px;margin-top:0}.ans.wide .arow{grid-template-columns:5em minmax(0,1.4fr) minmax(0,1fr)}.ans.wide .bar{height:2.2em}.ans.wide .awhy{grid-column:3;font-size:.9em;line-height:1.4}
@media (max-height:800px){.revgrid{gap:8px}.revgrid .scard{font-size:.78em;padding:10px 16px;gap:6px}.ans.wide{gap:6px}.ans.wide .bar{height:1.8em}}
.lineup{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;flex:1}
@media (max-width:700px){.lineup{grid-template-columns:repeat(2,minmax(0,1fr))}}
.who{border:0;border-radius:16px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;font-family:var(--round);color:var(--ink);text-align:center;transition:transform .2s}
.who:hover{transform:translateY(-4px)}
.who canvas{width:100%;max-width:120px;image-rendering:pixelated}
.who .gn{font:400 13px var(--pixel);color:var(--muted)}
.who .tn{font:900 16px var(--round)}
.who .tl{font-size:12px;color:var(--muted);line-height:1.45}
.dex{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
@media (max-width:620px){.dex{grid-template-columns:repeat(3,minmax(0,1fr))}}
.dex button{border:0;border-radius:12px;padding:6px;text-align:center;font:500 12px var(--round);color:var(--ink);cursor:pointer;transition:transform .2s}
.dex button:hover{transform:translateY(-3px)}
body.host .dex button{font-size:.8em}
.dex canvas{width:100%;max-width:64px;image-rendering:pixelated}
.sum{display:grid;grid-template-columns:5em repeat(3,minmax(0,1fr));gap:6px 12px;align-items:end}
.sum>b{white-space:nowrap}.sum .bar{height:1.9em;font-size:.85em}
.sum .sall{border-top:2px solid var(--line);padding-top:8px;align-self:stretch;display:flex;flex-direction:column;justify-content:flex-end;gap:4px}
.stop{font-weight:700;font-size:.85em}
/* phone */
.phone{background:var(--glass-strong);backdrop-filter:blur(14px);border:8px solid var(--ink);border-radius:32px;padding:16px 14px;height:640px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;max-width:320px;width:100%;justify-self:center;position:relative}
.phone h3{margin:0;font:900 17px/1.4 var(--round)}
.phone p{margin:0;color:var(--muted);font-size:13px;line-height:1.6}
.pill{align-self:flex-start;background:var(--blue);color:var(--ink);border-radius:999px;padding:3px 10px;font:400 12px var(--pixel)}
.box{border:1px solid var(--line);background:rgba(255,255,255,.7);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px}
.box .t{font:400 12px var(--pixel);letter-spacing:.08em;color:var(--muted)}
.opt{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:9px 10px;font:500 14px var(--round);cursor:pointer;text-align:left}
.opt.sel{border-color:var(--red-ink);color:var(--red-ink);background:color-mix(in srgb,var(--red) 30%,#fff);font-weight:700}
.lever{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;border-radius:10px;padding:8px 10px;gap:10px}
.lever.m{background:color-mix(in srgb,var(--red) 40%,#fff)}.lever.it{background:color-mix(in srgb,var(--blue) 40%,#fff)}.lever.e{background:color-mix(in srgb,var(--green) 50%,#fff)}
.lever div{min-width:0}
.stp{display:flex;align-items:center;gap:6px;flex:none}
.stp button{flex:none;width:36px;height:36px;padding:0;font-size:18px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink);font-weight:700;cursor:pointer}
.stp b{font:400 18px var(--pixel);width:14px;text-align:center}
textarea{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:10px;padding:8px;font:14px var(--round);background:#fff;color:var(--ink);resize:none}
.groupsel{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.groupsel button{padding:12px 0;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);font:400 18px var(--pixel);cursor:pointer}
.groupsel button.sel{background:var(--ink);color:#fff}
.confirm{background:color-mix(in srgb,var(--yellow) 50%,#fff);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;font-size:13px}
.waiting{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;margin:auto 0}
.waiting canvas{width:120px;image-rendering:pixelated;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
/* pop-up */
.pop{position:fixed;inset:0;background:rgba(43,48,70,.35);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.pop .in{background:var(--glass-strong);border-radius:22px;padding:14px;max-width:420px;width:100%;max-height:92vh;overflow:auto;display:flex;flex-direction:column;gap:10px;animation:popin .45s cubic-bezier(.2,1.4,.4,1)}
.pop img{width:100%;border-radius:14px;display:block}
.pop .acts{display:flex;gap:8px}.pop .acts .btn{flex:1}
.pop .hint{font-size:12px;color:var(--muted);text-align:center;margin:0}
.phone .pop{position:absolute;border-radius:24px}
@keyframes popin{from{transform:scale(.6);opacity:0}}
@media (prefers-reduced-motion:reduce){.timer,.groups.live .g,.waiting canvas,.sil canvas,.pop .in{animation:none}.who{transition:none}}

html,body{height:100%}
.hostwrap{height:100vh;display:flex;flex-direction:column;gap:12px;padding:16px;box-sizing:border-box}
.hostwrap[hidden]{display:none}
.hostwrap .stage{flex:1;min-height:0;overflow:auto;font-size:clamp(15px,1.35vw,22px)}
body.host .scard h3{font-size:1.35em}
body.host .g{font-size:.75em}body.host .g b{font-size:1.2em}
.hbar{display:flex;gap:10px;align-items:center;border-radius:14px;padding:10px 12px;flex-wrap:wrap}
.hbar #stepname{font-weight:700}
#reset{min-width:10em}
#playerwrap .phone{border:0;border-radius:0;height:auto;min-height:100vh;max-width:520px;margin:0 auto;padding:20px 16px 40px;box-sizing:border-box;background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none;overflow:visible}
.ptop{display:flex;justify-content:space-between;align-items:center}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;font:500 13px var(--round);cursor:pointer}
.pill.soft{background:var(--yellow)}
.errline{color:var(--red-ink);font-size:13px;margin:0}
.qrbox{background:#fff;padding:12px;border-radius:14px;line-height:0;min-width:120px;min-height:120px}
.url{font-weight:700;margin-top:8px}
.cover{margin:auto;display:flex;gap:clamp(24px,3vw,48px);align-items:stretch;flex-wrap:wrap;justify-content:center}
.cside{display:flex;flex-direction:column;justify-content:space-between;gap:16px}
.sil{display:grid;grid-template-columns:repeat(6,auto);gap:10px}
.sil canvas{width:clamp(72px,8vw,130px);image-rendering:pixelated;animation:bob 1.6s ease-in-out infinite}
.sil canvas:nth-child(2n){animation-delay:-.8s}.sil canvas:nth-child(3n){animation-delay:-.4s}
.lineup{flex:none;align-items:start}
/* scenario card */
.scard .co{color:var(--muted);font-size:.85em;margin-top:2px}
.role{display:flex;gap:8px;align-items:baseline;font-weight:700;line-height:1.5}
.tag{flex:none;background:var(--lav);border-radius:999px;padding:1px 9px;font-size:.8em;font-weight:700}
.scbody{display:grid;gap:12px}
body.host .flist{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:900px){body.host .flist{grid-template-columns:repeat(2,minmax(0,1fr))}}
body.host .flist .vk,body.host .flist .vw{display:block}
body.host .flist .vk{font-size:1.05em;font-weight:900;color:var(--ink);letter-spacing:.05em;margin-bottom:2px}
.sl{font-size:.78em;font-weight:700;letter-spacing:.1em;color:var(--muted);margin-bottom:4px}
.scard p.story{margin:0 0 6px;color:var(--ink);font-size:1em;line-height:1.75}
.scard .flist{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:.95em;line-height:1.55}
.flist li{background:rgba(255,255,255,.75);border:1px solid var(--line);border-radius:10px;padding:7px 10px}
.ask b{color:var(--red-ink)}
.flist li.m{border-left:5px solid var(--red)}.flist li.it{border-left:5px solid var(--blue)}.flist li.e{border-left:5px solid var(--green)}.flist li.ban{border-left:5px solid #c3c8d3}
.flist .vk{font-size:.75em;font-weight:700;color:var(--muted);margin-right:6px}.flist .vw{margin-right:2px}
.flist small{display:block;color:var(--muted);font-size:.85em;margin-top:2px}
.ask{background:color-mix(in srgb,var(--yellow) 55%,#fff);border-radius:10px;padding:8px 12px;font-weight:700}
.phone .scard{padding:14px;font-size:15px}
.phone .scard h3{font-size:18px;line-height:1.4}
/* rule */
.levers{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.lv{border-radius:12px;padding:10px 12px;line-height:1.55;font-size:.9em}
.lv b{display:block;font-size:1.15em;margin-bottom:2px}
.lv.m{background:color-mix(in srgb,var(--red) 40%,#fff)}.lv.it{background:color-mix(in srgb,var(--blue) 40%,#fff)}.lv.e{background:color-mix(in srgb,var(--green) 50%,#fff)}.lv.ban{background:#eceef3;color:var(--muted)}.lv.ban b{color:var(--ink)}
.phone .levers{grid-template-columns:minmax(0,1fr);gap:6px}.phone .lv{font-size:13px}
/* host rule page */
.rule{flex:1;display:flex;flex-direction:column;justify-content:space-evenly;gap:20px;font-size:1.15em}
.rhead{text-align:center;display:flex;flex-direction:column;gap:6px}
.rsub{margin:0;font-size:1.2em}
.dots{display:inline-flex;gap:.25em;vertical-align:middle}
.dot{width:.8em;height:.8em;border-radius:50%;border:2px solid var(--line);box-sizing:border-box}
.dot.k{background:var(--ink);border-color:var(--ink)}.dot.m{background:var(--red-ink);border-color:var(--red-ink)}.dot.it{background:var(--blue-ink);border-color:var(--blue-ink)}.dot.e{background:#6f9a3f;border-color:#6f9a3f}
.rlev{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) auto minmax(0,1fr);gap:12px;align-items:stretch}
.rlev .lv{padding:20px 22px;font-size:1em;line-height:1.6}
.rlev .lv b{font-size:1.4em;margin-bottom:6px}
.rlev .lv.ban{border:2px dashed #c3c8d3;background:transparent}
.rlev .lv small{display:block;margin-top:6px;font-size:.85em}
.ror{align-self:center;font-weight:900;color:var(--muted)}
.rex{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
.rex .sl{margin:0}
.chip{display:inline-flex;align-items:center;gap:.5em;background:var(--glass-strong);border:1px solid var(--line);border-radius:999px;padding:4px 14px;font-weight:700}
.rsteps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.rsteps li{background:var(--glass-strong);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;grid-template-columns:auto 1fr;column-gap:12px;align-items:center;color:var(--muted);line-height:1.5}
.rsteps i{grid-row:span 2;width:2em;height:2em;border-radius:50%;background:var(--ink);color:#fff;font-style:normal;font-weight:900;display:flex;align-items:center;justify-content:center}
.rsteps b{color:var(--ink);font-size:1.15em}
ol.flow{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:3px;line-height:1.6}
.phone ol.flow{font-size:13px}
/* answer bars */
.ans{display:flex;flex-direction:column;gap:10px;margin-top:auto}
.arow{display:grid;grid-template-columns:5em minmax(0,1fr);column-gap:12px;row-gap:2px;align-items:center}
.arow>b{font-weight:900;white-space:nowrap}
.bar{display:flex;gap:3px;height:2.3em;border-radius:10px;overflow:hidden}
.bar span{display:flex;align-items:center;justify-content:center;min-width:0;font-weight:700;white-space:nowrap;overflow:hidden}
.s-m{background:var(--red)}.s-it{background:var(--blue)}.s-e{background:var(--green)}.s-ban{background:#c3c8d3}
.s-miss{flex:1;border:2px dashed var(--line);border-radius:10px;color:var(--muted)}
.awhy{grid-column:2;color:var(--muted);font-size:.85em}
/* character intro */
.pop .in.intro{max-width:520px;align-items:center;text-align:center;padding:22px;font-size:clamp(15px,1.3vw,20px);line-height:1.65}
.ihead{border-radius:20px;padding:6px;line-height:0}.ihead canvas{width:160px;image-rendering:pixelated}
.icode{color:var(--muted);font-weight:700;letter-spacing:.1em;font-size:.8em}
.intro h3{margin:0;font:900 1.8em var(--round)}
.intro p{margin:0}.itag{font-weight:700}
.traits{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.traits span{background:rgba(255,255,255,.85);border:1px solid var(--line);border-radius:999px;padding:2px 12px;font-size:.85em}
.ithink{background:color-mix(in srgb,var(--yellow) 50%,#fff);border-radius:12px;padding:8px 12px}
.intro .btn{align-self:stretch}
</style></head>
<body>
<div id="hostwrap" class="hostwrap">
  <section class="stage glass" id="stage"></section>
  <div class="hbar glass">
    <button class="btn ghost" id="reset">重設遊戲</button>
    <button class="btn ghost" id="prev">上一步</button>
    <span id="stepname"></span><span class="timer" id="timer"></span><span id="err" class="errline"></span>
    <button class="btn ghost" id="share" hidden>▶ 分享計時 1 分鐘</button><button class="btn ghost" id="reveal" hidden>揭曉本題</button>
    <button class="btn" id="next">下一步</button>
  </div>
</div>
<div id="playerwrap"><section class="phone" id="phone"></section></div>
<div id="pop"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
/* HERO 製造機・遊戲設計：筱于 */
/* ---------- content ---------- */
const SC=[
 {title:'晶片廠：工程師偷用 AI，程式碼外流了',short:'晶片廠｜程式碼外流',co:'星河半導體・研發工程師 1,200 人',
  role:'研發副總，這週要決定公司的 AI 政策',
  story:['工程師用私人 AI 帳號貼程式碼除錯，一個月內外流了 3 次。'],
  voices:[{k:'m',who:'人資長',say:'主管公開訂好界線：哪些能貼、哪些不能，出事主管扛。',cost:'沒有安全的工具，規矩只能叫大家忍著不用'},
   {k:'it',who:'資訊長',say:'買一套資料不外流的企業版 AI，從源頭解決。',cost:'要半年導入，還要一大筆預算'},
   {k:'e',who:'研發處長',say:'讓會用的工程師帶大家，教怎麼去掉敏感資料再問 AI。',cost:'還是在用私人帳號，風險沒有歸零'},
   {k:'ban',who:'法務長',say:'全面禁用，先止血再說。',cost:'工程師可能改用手機偷偷用，更難管'}]},
 {title:'行銷公司：大家都在用，卻沒人敢承認',short:'行銷公司｜不敢承認',co:'森語行銷・員工 80 人・平均 29 歲',
  role:'剛上任的營運長',
  story:['總監說過「用 AI 寫提案就是偷懶」。實習生用 AI 做的提案讓客戶簽約了，卻說是熬夜做的。'],
  voices:[{k:'m',who:'執行長',say:'由我在全員大會公開說可以用，用了被罵算我的。',cost:'總監會覺得被打臉，團隊可能分成兩派'},
   {k:'it',who:'資訊主管',say:'去年買的企業版只有 9% 登入，太難用了。換一套接進提案系統的工具。',cost:'又要花錢，而且大家不用可能不是因為工具'},
   {k:'e',who:'實習生',say:'讓我公開分享怎麼用 AI 做提案，辦每週讀書會。',cost:'總監還在，敢上台分享的人可能很少'},
   {k:'ban',who:'總監',say:'乾脆禁用，品質才有保障。',cost:'會用的人可能被競爭對手挖走'}]},
 {title:'銀行客服：工具有了，大家卻用不起來',short:'銀行客服｜用不起來',co:'宏遠銀行客服中心・客服人員 300 人',

 if(/^s\d$/.test(k)&&!S.revealed){const r=remaining();if(r!==null){if(r>0){txt='⏱ 討論 '+fmt(r);cls=r<=30?'warn':''}else{txt='⏰ 討論時間到';cls='over'}}}
 if(/^s\d$/.test(k)&&S.revealed&&shareEnd){const r=Math.max(0,Math.ceil((shareEnd-Date.now())/1000));if(r>0){txt='🗣 分享 '+fmt(r);cls=r<=10?'warn':'share'}else{txt='⏰ 分享時間到';cls='over'}}
 t.textContent=txt;t.className='timer '+cls;const sb=$('share');if(sb)sb.textContent=shareEnd?'重新計時 1 分鐘':'▶ 分享計時 1 分鐘'},500);

/* ---------- pop-up & download ---------- */
async function openPop(hostEl,type,g){
 const card=await makeCard(type,g),url=card.toDataURL('image/png');
 hostEl.innerHTML=`<div class="pop" data-close="1"><div class="in" role="dialog" aria-label="決策風格圖卡"><img src="${url}" alt="第 ${g} 組：${TYPES[type].name}"><div class="acts"><button class="btn" data-dl="1">下載圖卡</button><button class="btn ghost" data-close="1">關閉</button></div><p class="hint">手機也可以長按圖片儲存</p></div></div>`;
 hostEl.querySelector('[data-dl]').onclick=()=>card.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`HERO製造機_第${g}組_${TYPES[type].name}.png`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)},'image/png');
}
document.addEventListener('click',e=>{const cl=e.target.closest('[data-close]');if(cl&&(e.target===cl||cl.tagName==='BUTTON')){$('pop').innerHTML=''}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('pop').innerHTML=''});

/* ---------- shared stage pieces ---------- */
function scenarioCard(c){return `<div class="scard"><div><h3>${c.title}</h3><div class="co">${c.co}</div></div>
 <div class="role"><span class="tag">你是</span>${c.role}</div>
 <div class="scbody"><div><div class="sl">發生什麼事</div>${c.story.map(t=>`<p class="story">${t}</p>`).join('')}</div>
  <div><div class="sl">四個提案</div><ul class="flist">${c.voices.map(v=>`<li class="${v.k}"><span class="vk">${NM[v.k]}</span><b class="vw">${v.who}</b>「${v.say}」<small>代價：${v.cost}</small></li>`).join('')}</ul></div></div>
 <div class="ask">${ASK}</div></div>`}
const leverCards=()=>`<div class="levers">${['m','it','e'].map(k=>`<div class="lv ${k}"><b>${LEVER[k]}</b>${LEVER_DESC[k]}</div>`).join('')}
 <div class="lv ban"><b>或者：全面禁用</b>不投任何資源，公司內禁止用 AI（選了就不能再投點）</div></div>`;

/* ---------- HOST (big screen) ---------- */
const seenOk=new Set();let qrDone=false,resetArmed=false;
function renderHost(){
 const k=STEPS[S.step].k,st=$('stage'),groups=[...Array(GROUPS)].map((_,i)=>i+1);
 const count=g=>(S.players.find(p=>p.group_no===g)||{}).n||0,total=S.players.reduce((a,p)=>a+p.n,0);
 $('stepname').textContent=`${S.step+1} / ${STEPS.length}・${STEPS[S.step].name}`;
 $('prev').disabled=S.step===0;$('reveal').hidden=!/^s\d$/.test(k)||S.revealed;$('share').hidden=!/^s\d$/.test(k)||!S.revealed;$('next').disabled=S.step===STEPS.length-1;
 if(S.error)$('err').textContent=S.error;else $('err').textContent='';
 if(k!=='join')qrDone=false;
 if(k==='join'){
  st.innerHTML=`<div class="eyebrow" style="text-align:center">換你們當決策者</div><h2 style="text-align:center">掃碼選組，測出你們這組的「AI 工具應用導入決策風格」</h2>
   <div class="cover"><div id="qr" class="qrbox"></div>
    <div class="cside"><div><div class="big">${total}</div><div style="color:var(--muted)">人已加入</div>
    <div class="url">${location.host}</div><div style="color:var(--muted);font-size:.85em;margin-top:6px">遊戲設計｜筱于</div></div>
    <div class="sil" id="sil"></div></div></div>
   <div class="groups">${groups.map(g=>`<div class="g ${count(g)?'ok':''}"><b>第 ${g} 組</b>${count(g)} 人</div>`).join('')}</div>`;
  ['GRD','BLD','CAP','MEN','BAL','EXP'].forEach(t=>{$('sil').appendChild(charCanvas(t,5))});
  if(window.QRCode){new QRCode($('qr'),{text:location.origin+'/',width:360,height:360,colorDark:'#2b3046',colorLight:'#ffffff'})}
  else $('qr').textContent=location.origin;
 }
 if(k==='rule'){
  const dots=(k,n)=>`<span class="dots">${[0,1,2].map(j=>`<i class="dot ${j<n?k:''}"></i>`).join('')}</span>`;
  st.innerHTML=`<div class="rule"><div class="rhead"><div class="eyebrow">遊戲規則</div><h2>你們是公司的決策者</h2>
    <p class="rsub">每題有 ${dots('k',3)} <b>3 點資源</b>，投給你們覺得最該先做的事</p></div>
   <div class="rlev">${['m','it','e'].map(k=>`<div class="lv ${k}"><b>${LEVER[k]}</b>${LEVER_DESC[k]}</div>`).join('')}
    <div class="ror">或</div><div class="lv ban"><b>全面禁用</b>不投任何資源，公司內禁止用 AI<small>選了就不能再投點</small></div></div>
   <div class="rex"><span class="sl">投法範例</span><span class="chip">主管 ${dots('m',2)}</span><span class="chip">IT ${dots('it',1)}</span><span class="chip">高手 ${dots('e',0)}</span><span class="co">也可以 3 點全押同一個</span></div>
   <ol class="rsteps"><li><i>1</i><b>組內討論</b>每題 4 分鐘</li><li><i>2</i><b>手機送出</b>任一人送出就好，送出就鎖定</li><li><i>3</i><b>輪流分享</b>揭曉後每組 1 分鐘，說說為什麼這樣投</li><li><i>4</i><b>揭曉風格</b>三題結束後，看你們是哪種決策者</li></ol>
   <div class="co" style="text-align:center">沒有標準答案，也不打分數</div></div>`;
 }
 const sm=k.match(/^s(\d)$/);
 if(sm){const i=+sm[1];
  const gs=activeGroups();
  if(S.revealed)st.innerHTML=`<div class="eyebrow">情境 ${i+1} / 3・結果揭曉</div>
   <div class="revgrid">${scenarioCard(SC[i])}<div class="ans wide">${gs.map(g=>ansRow(g,i,true)).join('')}</div></div>`;
  else st.innerHTML=`<div class="eyebrow">情境 ${i+1} / 3</div>${scenarioCard(SC[i])}
   <div class="groups live">${gs.map(g=>{const ok=!!subOf(g,i),id=i+'-'+g,fresh=ok&&!seenOk.has(id);if(ok)seenOk.add(id);return `<div class="g ${ok?'ok':''} ${fresh?'new':''}"><b>第 ${g} 組</b>${ok?'已送出 ✓':'討論中…'}</div>`}).join('')}</div>`;
 }
 if(k==='reveal'){const gs=activeGroups();
  st.innerHTML=`<div class="eyebrow">決策風格揭曉・點角色看圖卡</div><h2>你們這組是哪一種 AI 決策者？</h2>
   <div class="lineup">${gs.map(g=>{const t=classify(g),T=TYPES[t];return `<button class="who" data-pop="${g}" style="background:color-mix(in srgb,${T.bg} 55%,#fff)"><span class="gn">第 ${g} 組</span><i data-c="${t}"></i><span class="tn">${T.name}</span><span class="tl">${T.tag}</span></button>`}).join('')||'<p>還沒有任何組別送出</p>'}</div>`;
  st.querySelectorAll('[data-c]').forEach(e=>e.replaceWith(charCanvas(e.dataset.c,5)));
 }
 if(k==='clue'){const gs=activeGroups();
  st.innerHTML=`<div class="eyebrow">論文觀點</div><h2>HERO 需要三方一起撐</h2>
   <div class="scard"><p style="margin:0;line-height:1.75">《Empowered》的「HERO 契約」：員工想用新科技解決問題，需要<b>主管撐腰</b>、<b>IT 鋪路</b>、<b>高手帶路</b>（同事互相帶動），三方缺一不可。先押哪一方沒有標準答案，重要的是另外兩方怎麼補上。</p></div>
   ${sumTable(gs)}
   <div class="eyebrow">六種決策風格・點角色看介紹</div>
   <div class="dex">${Object.entries(TYPES).map(([t,T])=>`<button data-intro="${t}" style="background:color-mix(in srgb,${T.bg} 55%,#fff)"><i data-c="${t}"></i><br>${T.name}</button>`).join('')}</div>
   <div class="co">延伸閱讀：Mollick《Co-Intelligence》（中譯《工作者的 AI 共智模式》）</div>`;
  st.querySelectorAll('[data-c]').forEach(e=>{const c=charCanvas(e.dataset.c,3);c.style.cssText='width:100%;max-width:60px;image-rendering:pixelated';e.replaceWith(c)});
 }
}
function sumTable(gs){
 const keys=['m','it','e'],tot={m:0,it:0,e:0,ban:0};
 const agg=SC.map((c,i)=>{const a={m:0,it:0,e:0,ban:0};gs.forEach(g=>{const p=plan(g,i);if(p.missing)return;if(p.ban)a.ban++;else keys.forEach(k=>a[k]+=p[k])});keys.concat('ban').forEach(k=>tot[k]+=a[k]);return a});
 const aggCell=a=>{const mx=Math.max(a.m,a.it,a.e),n=a.m+a.it+a.e+a.ban;
  if(!n)return'<div class="co">還沒有資料</div>';
  const top=mx?`最多押「${keys.filter(k=>a[k]===mx).map(k=>NM[k]).join('」「')}」（${mx} 點）`:'全部選了全面禁用';
  return`<div class="stop">${top}</div><div class="bar">${keys.filter(k=>a[k]).map(k=>`<span class="s-${k}" style="flex:${a[k]}">${{m:'主管',it:'IT',e:'高手'}[k]} ${a[k]}</span>`).join('')}${a.ban?`<span class="s-ban" style="flex:${a.ban*3}">禁用 ${a.ban} 組</span>`:''}</div>`};
 const mn=Math.min(tot.m,tot.it,tot.e),low=keys.filter(k=>tot[k]===mn).map(k=>`「${NM[k]}」`).join('、');
 return`<div class="sum"><span></span>${SC.map(c=>`<b>${c.short}</b>`).join('')}
  ${gs.map(g=>`<b>第 ${g} 組</b>${SC.map((c,i)=>ansBar(plan(g,i))).join('')}`).join('')}
  <b class="sall">全班</b>${agg.map(a=>`<div class="sall">${aggCell(a)}</div>`).join('')}</div>
  ${tot.m+tot.it+tot.e+tot.ban?`<div class="ask">📊 三題加總：主管 ${tot.m}・IT ${tot.it}・高手 ${tot.e}・全面禁用 ${tot.ban} 次<br>→ 最少被押的是${low}。如果三方缺一不可，這一方誰來補？</div>`:''}`}
function ansBar(p){
 if(p.missing)return'<div class="bar"><span class="s-miss">未送出</span></div>';
 if(p.ban)return'<div class="bar"><span class="s-ban" style="flex:3">全面禁用</span></div>';
 return`<div class="bar">${['m','it','e'].filter(k=>p[k]).map(k=>`<span class="s-${k}" style="flex:${p[k]}">${{m:'主管',it:'IT',e:'高手'}[k]} ${p[k]}</span>`).join('')}</div>`}
function ansRow(g,i,withWhy){const p=plan(g,i);return`<div class="arow"><b>第 ${g} 組</b>${ansBar(p)}${withWhy&&p.why&&!p.missing?`<span class="awhy">「${esc(p.why)}」</span>`:''}</div>`}
function introPop(t){const T=TYPES[t];
 $('pop').innerHTML=`<div class="pop" data-close="1"><div class="in intro" role="dialog" aria-label="${T.name}">
  <div class="ihead" style="background:${T.bg}"><i data-c="${t}"></i></div>
  <div class="icode">TYPE ${T.code}</div><h3>${T.name}</h3><p class="itag">${T.tag}</p>
  <div class="traits">${T.traits.map(x=>`<span>${x}</span>`).join('')}</div>
  <p>${T.paper}</p><p class="ithink">🤔 ${T.think}</p>
  <button class="btn ghost" data-close="1">關閉</button></div></div>`;
 $('pop').querySelectorAll('[data-c]').forEach(e=>{const c=charCanvas(e.dataset.c,8);e.replaceWith(c)})}
async function hostGo(step){const r=await api('/api/host',{key:HOST_KEY,action:'go',step});if(!r.ok)$('err').textContent=r.error||'切換失敗';await poll()}

/* ---------- PLAYER (phone) ---------- */
let d={m:0,it:0,e:0,ban:false,why:''},confirming=false,draftFor=-1,popShownFor=null,sending=false,flash='';
function renderPlayer(){
 const k=STEPS[S.step].k,ph=$('phone');
 if(!S.loaded){ph.innerHTML=`<div class="waiting"><p>${S.error||'連線中…'}</p></div>`;return}
 const err=S.error?`<p class="errline">${esc(S.error)}</p>`:'';
 if(!myGroup){
  ph.innerHTML=`<span class="pill">HERO 製造機</span><h3>你在第幾組？</h3><p>照座位分好的組別點一下就好，不用填名字</p>
   <div class="groupsel">${[...Array(GROUPS)].map((_,i)=>`<button data-g="${i+1}">${i+1}</button>`).join('')}</div>${err}
   <p style="margin-top:auto;font-size:12px">遊戲設計｜筱于</p>`;return}
 const G=myGroup,head=`<div class="ptop"><span class="pill">第 ${G} 組</span><button class="link" data-regroup="1">換組</button></div>`;
 if(k==='join'){ph.innerHTML=`${head}<div class="waiting"><i data-w="BAL"></i><h3>第 ${G} 組報到完成</h3><p>等主持人開始</p></div>${err}`}
 if(k==='rule'){ph.innerHTML=`${head}<h3>你們是公司的決策者<br>每題有 3 點資源，投給最該先做的事</h3>
   ${leverCards()}
   <div class="box"><span class="t">怎麼玩</span><ol class="flow"><li>每題 4 分鐘，組內討論</li><li><b>任一人</b>送出就好，送出就鎖定</li><li>可附一句理由（選填）</li><li>揭曉後每組輪流分享 1 分鐘</li><li>三題後揭曉你們的決策風格</li></ol></div>
   <p>例：主管 2、IT 1、高手 0，也可以 3 點全押一個。沒有標準答案</p>${err}`}
 const sm=k.match(/^s(\d)$/);
 if(sm){const i=+sm[1],c=SC[i],sub=subOf(G,i);
  if(draftFor!==i){d={m:0,it:0,e:0,ban:false,why:''};confirming=false;draftFor=i}
  if(sub){ph.innerHTML=`${head}<span class="pill soft">情境 ${i+1}・已送出</span>${sub.why!==undefined?`<h3>${pTxt(sub)}</h3>${sub.why?`<p>「${esc(sub.why)}」</p>`:''}`:''}<div class="waiting"><i data-w="EXP"></i><p>${S.revealed?'本題已揭曉，看大螢幕':'等主持人揭曉，先看大螢幕'}</p></div>${flash?`<p class="errline">${flash}</p>`:''}`}
  else if(S.revealed){ph.innerHTML=`${head}<span class="pill soft">情境 ${i+1}・已結束</span><div class="waiting"><p>本題已揭曉，這題沒有送出</p></div>${err}`}
  else{const left=3-d.m-d.it-d.e;
   const lev=id=>`<div class="lever ${id}"><div><b>${LEVER[id]}</b></div><div class="stp"><button data-l="${id}" data-d="-1" aria-label="減少${LEVER[id]}">−</button><b>${d[id]}</b><button data-l="${id}" data-d="1" aria-label="增加${LEVER[id]}">＋</button></div></div>`;
   ph.innerHTML=`${head}<span class="pill soft">情境 ${i+1} / 3</span>${scenarioCard(c)}
    <div class="box"><span class="t">你們的決策・還剩 ${d.ban?0:left} 點可投</span>
     ${d.ban?'<p>已選全面禁用，三根槓桿都不能用</p>':lev('m')+lev('it')+lev('e')}
     <button class="opt ${d.ban?'sel':''}" data-ban="1">${d.ban?'✓ ':''}全面禁用 AI（不投點，公司內禁止使用）</button>
     <textarea id="why" rows="2" maxlength="30" placeholder="一句話理由（選填，30 字內）">${esc(d.why)}</textarea></div>
    ${confirming?`<div class="confirm"><b>確定送出？</b>${pTxt(d)}<br>送出後全組都不能改<div class="row" style="gap:8px"><button class="btn" id="yes" ${sending?'disabled':''}>${sending?'送出中…':'確定送出'}</button><button class="btn ghost" id="no">再想想</button></div></div>`
     :`<button class="btn" id="sub" ${(!d.ban&&left>0)?'disabled':''}>送出本組決策</button><p id="subhint">${(!d.ban&&left>0)?'3 點要用完':''}</p>`}
    ${flash?`<p class="errline">${flash}</p>`:''}${err}`}}
 if(k==='reveal'||k==='clue'){const t=classify(G),T=TYPES[t];
  ph.innerHTML=`${head}<div class="waiting"><i data-w="${t}" data-u="6"></i><h3>第 ${G} 組是<br>${T.name}</h3><p>${T.tag}</p><button class="btn" id="mycard">打開我們的圖卡</button>
   ${k==='clue'?'<p>每一種角色都有擅長的地方，沒有哪一隻最好</p>':''}</div>${err}`;
  if(k==='reveal'&&popShownFor!==G){popShownFor=G;openPop($('pop'),t,G)}}
 ph.querySelectorAll('[data-w]').forEach(e=>e.replaceWith(charCanvas(e.dataset.w,+e.dataset.u||5)));
}

function render(){if(MODE==='host')renderHost();else renderPlayer()}

/* ---------- events ---------- */
document.addEventListener('input',e=>{if(e.target.id==='why'){d.why=e.target.value;const b=$('sub'),h=$('subhint'),left=3-d.m-d.it-d.e;if(b)b.disabled=(!d.ban&&left>0);if(h)h.textContent=(!d.ban&&left>0)?'3 點要用完':''}});
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;
 if(MODE==='host'){
  if(b.id==='share'){shareEnd=Date.now()+SHARE_SECONDS*1000;shareStep=S.step;return}
  if(b.id==='next')return hostGo(S.step+1);
  if(b.id==='prev')return hostGo(S.step-1);
  if(b.id==='reveal'){const r=await api('/api/host',{key:HOST_KEY,action:'reveal'});if(!r.ok)$('err').textContent=r.error||'揭曉失敗';return poll()}
  if(b.id==='reset'){if(!resetArmed){resetArmed=true;b.textContent='再按一次確認清空';setTimeout(()=>{resetArmed=false;b.textContent='重設遊戲'},4000);return}
   resetArmed=false;b.textContent='重設遊戲';const r=await api('/api/host',{key:HOST_KEY,action:'reset'});if(!r.ok)$('err').textContent=r.error||'重設失敗';return poll()}
  if(b.dataset.pop){const g=+b.dataset.pop;return openPop($('pop'),classify(g),g)}
  if(b.dataset.intro)return introPop(b.dataset.intro);
  return}
 if(b.dataset.g){myGroup=+b.dataset.g;store.set('hero_group',myGroup);api('/api/join',{id:myId,group:myGroup});lastKey='';return poll()}
 if(b.dataset.regroup){myGroup=null;popShownFor=null;lastKey='';return render()}
 if(b.id==='mycard')return openPop($('pop'),classify(myGroup),myGroup);
 if(b.dataset.l&&!d.ban){const id=b.dataset.l,x=+b.dataset.d;if(x>0&&d.m+d.it+d.e>=3)return;d[id]=Math.max(0,d[id]+x);flash='';return render()}
 if(b.dataset.ban){d.ban=!d.ban;if(d.ban){d.m=d.it=d.e=0}flash='';return render()}
 if(b.id==='sub'){confirming=true;return render()}
 if(b.id==='no'){confirming=false;return render()}
 if(b.id==='yes'&&!sending){sending=true;render();
  const i=+STEPS[S.step].k[1];const r=await api('/api/submit',{group:myGroup,scenario:i,...d});
  sending=false;confirming=false;
  flash=r.ok?'':(r.already?'你們組已經有人先送出了':(r.error||'送出失敗，請再按一次'));
  lastKey='';return poll()}
});

if(MODE==='host'){document.body.classList.add('host');$('playerwrap').hidden=true}else{document.body.classList.add('player');$('hostwrap').hidden=true}
if(myGroup&&MODE==='player')api('/api/join',{id:myId,group:myGroup});
render();poll();setInterval(poll,2000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll()});

</script>
</body></html>
